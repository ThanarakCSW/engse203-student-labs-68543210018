<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENGSE203 LAB 3</title>
  <script type="module" crossorigin src="/assets/index-DV_HCX0b.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Er9O8Sr0.css">
</head>
<body>
  <header class="hero">
    <div class="container hero__content">
      <p class="eyebrow">ENGSE203 • LAB 3</p>
      <h1>Campus Service Request</h1>
      <p class="hero__lead">Responsive Web UI, Event and Form</p>
    </div>
  </header>

  <main class="container page-grid">
    <section class="panel" aria-labelledby="form-title">
      <div class="section-heading">
        <h2 id="form-title">Create Service Request</h2>
      </div>
      <form id="request-form" novalidate>
        
        <!-- TODO 1: Requester Name field -->
        <div class="field form-group">
          <label for="requester-name">Requester Name</label>
          <input type="text" id="requester-name" name="requesterName" placeholder="Enter your name" required aria-describedby="name-error">
          <span id="name-error" class="error error-message" aria-live="polite"></span>
        </div>

        <!-- TODO 2: Request Type select -->
        <div class="field form-group">
          <label for="request-type">Request Type</label>
          <select id="request-type" name="requestType" required aria-describedby="type-error">
            <option value="">-- Please Select --</option>
            <option value="IT Support">IT Support</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Cleaning">Cleaning</option>
          </select>
          <span id="type-error" class="error error-message" aria-live="polite"></span>
        </div>

        <!-- TODO 3: Details textarea -->
        <div class="field form-group">
          <label for="request-details">Details</label>
          <textarea id="request-details" name="requestDetails" rows="4" placeholder="Enter details..." required aria-describedby="details-error"></textarea>
          <span id="details-error" class="error error-message" aria-live="polite"></span>
        </div>

        <div class="actions">
          <button type="submit">Submit Request</button>
        </div>
        <p id="form-status" class="status" role="status"></p>
      </form>
    </section>

    <aside class="panel preview-panel" aria-labelledby="preview-title">
      <div class="section-heading">
        <h2 id="preview-title">Live Preview</h2>
      </div>
      <dl id="preview" class="preview-dl" aria-live="polite">
        <div class="dl-group"><dt>Name</dt><dd id="preview-name">ยังไม่ระบุชื่อ</dd></div>
        <div class="dl-group"><dt>Type</dt><dd id="preview-type">ยังไม่เลือกประเภท</dd></div>
        <div class="dl-group"><dt>Details</dt><dd id="preview-details">ยังไม่มีรายละเอียด</dd></div>
      </dl>
      
      <hr class="preview-divider">
      
      <div class="section-heading">
        <h3 class="submitted-title">Submitted Requests</h3>
      </div>
      <ul id="request-list" class="request-list"></ul>
    </aside>
  </main>
</body>
</html>
