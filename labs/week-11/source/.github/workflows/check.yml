name: Campus Service CI

on:
  push:
    branches: [main, 'unit*/**', 'lab/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test API
        run: |
          cd labs/week-11/source/api || cd api
          npm ci || npm install
          npm test
      - name: Install and build Frontend
        run: |
          cd labs/week-11/source/frontend || cd frontend
          npm ci || npm install
          npm run build
